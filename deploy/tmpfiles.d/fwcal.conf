# Directories and modes (DESIGN §7). Install to /etc/tmpfiles.d/fwcal.conf, then
# run `systemd-tmpfiles --create /etc/tmpfiles.d/fwcal.conf`.
#
# auth:   token cache, sync user only.
# data:   events.json; setgid so files written by sync belong to group fwcal-web.
# photos: background photos; an administrator adds them with sudo.
d /etc/fwcal              0750 root       fwcal      -
d /var/lib/fwcal          0755 root       root       -
d /var/lib/fwcal/auth     0700 fwcal-sync fwcal-sync -
d /var/lib/fwcal/data     2750 fwcal-sync fwcal-web  -
d /var/lib/fwcal/photos   0750 root       fwcal-web  -
