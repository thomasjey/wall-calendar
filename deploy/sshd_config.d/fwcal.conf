# SSH hardening (DESIGN §9.3). Install to /etc/ssh/sshd_config.d/fwcal.conf.
# Add your public key to ~/.ssh/authorized_keys and test a key login in a
# second session BEFORE installing this file.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
MaxAuthTries 3
