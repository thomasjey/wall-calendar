# Service users (DESIGN §9.1). Install to /etc/sysusers.d/fwcal.conf, then run
# `systemd-sysusers`. Neither user can log in.
g fwcal      -
u fwcal-sync - "wall-calendar sync"         /var/lib/fwcal/auth /usr/sbin/nologin
u fwcal-web  - "wall-calendar web"          -                   /usr/sbin/nologin
m fwcal-sync fwcal
m fwcal-web  fwcal
