#!/usr/sbin/nft -f
# Host firewall (DESIGN §9.3). Install to /etc/nftables.conf and enable
# nftables.service. Replace 192.168.1.0/24 with your home network.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    # SSH from the home network only.
    ip saddr 192.168.1.0/24 tcp dport 22 ct state new accept
    # IPv6 neighbour discovery and ping, needed for IPv6 to work.
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, echo-request } accept
    icmp type echo-request limit rate 5/second accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
